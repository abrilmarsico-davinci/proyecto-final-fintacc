<!doctype html>
<html lang="es-AR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta
      name="description"
      content="Fintacc: productos, recetas y locales sin TACC en una sola plataforma pensada para personas celíacas."
    />
    <meta name="theme-color" content="#032622" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="es_AR" />
    <meta property="og:title" content="Fintacc · Alimentación segura sin TACC" />
    <meta
      property="og:description"
      content="Recetas, productos, locales sin TACC y sistema de puntos en comercios aliados para personas celíacas."
    />
    <meta property="og:image" content="assets/logo-fintacc.png" />
    <title>Fintacc · Alimentación sin TACC</title>
    <link rel="icon" type="image/png" sizes="256x256" href="assets/favicon-fintacc.png?v=3" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700&display=swap"
    />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <a class="saltar-contenido" href="#contenido">Saltar al contenido</a>

    <!-- La aplicación se dibuja dentro de este contenedor -->
    <div id="app"></div>

    <!-- Región en vivo para los avisos globales -->
    <div class="avisos" id="avisos" aria-live="polite"></div>

    <noscript>Fintacc necesita JavaScript habilitado para funcionar.</noscript>

    <!-- Librerías externas -->
    <script src="js/vendor/qrcode.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.119.0/dist/umd/supabase.js"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>

    <!-- Configuración -->
    <script src="js/config.js"></script>
    <script src="js/supabase-config.js"></script>

    <!-- Servicios: toda la comunicación con Supabase -->
    <script src="js/servicios/supabase.js"></script>
    <script src="js/servicios/auth.js"></script>
    <script src="js/servicios/catalogo.js"></script>
    <script src="js/servicios/reviews.js"></script>
    <script src="js/servicios/puntos.js"></script>
    <script src="js/servicios/comercios.js"></script>
    <script src="js/servicios/imagenes.js"></script>
    <script src="js/servicios/backoffice.js"></script>

    <!-- Estado y utilidades -->
    <script src="js/utilidades.js"></script>
    <script src="js/estado.js"></script>

    <!-- Componentes reutilizables -->
    <script src="js/componentes/avisos.js"></script>
    <script src="js/componentes/iconos.js"></script>
    <script src="js/componentes/estructura.js"></script>
    <script src="js/componentes/tarjetas.js"></script>
    <script src="js/componentes/reviews.js"></script>
    <script src="js/componentes/modales.js"></script>

    <!-- Pantallas -->
    <script src="js/pantallas/bienvenida.js"></script>
    <script src="js/pantallas/acceso.js"></script>
    <script src="js/pantallas/inicio.js"></script>
    <script src="js/pantallas/recetas.js"></script>
    <script src="js/pantallas/productos.js"></script>
    <script src="js/pantallas/locales.js"></script>
    <script src="js/pantallas/marca.js"></script>
    <script src="js/pantallas/puntos.js"></script>
    <script src="js/pantallas/perfil.js"></script>
    <script src="js/pantallas/editor-marca.js"></script>
    <script src="js/pantallas/backoffice.js"></script>
    <script src="js/pantallas/no-encontrada.js"></script>

    <!-- Eventos y router (el router arranca la aplicación) -->
    <script src="js/eventos.js"></script>
    <script src="js/router.js"></script>
  </body>
</html>
